[project]
name = "pdf-ai-tools"
version = "0.1.0"
description = "AI-friendly PDF creation and reading tools exposed as MCP tools"
readme = "README.md"
authors = [
    { name = "Keiner Alvarado", email = "kjgameplay0000@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.3.0",
    "Pillow>=10.0.0",
    "pypdf>=5.0.0",
    "qrcode[pil]>=7.4.0",
    "reportlab>=4.2.0",
    "toon-format>=1.2.0",
]

[project.scripts]
pdf-ai-tools = "pdf_ai_tools.cli:main"
pdf-ai-tools-mcp = "pdf_ai_tools.mcp_server:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff.lint]
# EXE002: this tree is stored with the executable bit forced on.
# BLE001: MCP tools return _err(str(e)) instead of raising into the agent.
ignore = ["EXE002", "BLE001"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
